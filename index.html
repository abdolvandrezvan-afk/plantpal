<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlantPal | گیاه‌یار</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ============================================
       هدر مشترک
       ============================================ -->
  <header class="app-header">
    <div class="app-header-content">
      <h1 class="app-title">🌱 PlantPal</h1>
      <p class="app-subtitle">گیاه‌یار — همراه شما در مراقبت از گیاهان</p>
    </div>
  </header>

  <!-- ============================================
       بخش اصلی — شامل سه صفحه
       ============================================ -->
  <main class="app-main">

    <!-- ============================================
         صفحه اصلی (Home)
         ============================================ -->
    <section id="page-home" class="page active">
      <div class="page-header">
        <h2 class="page-title">گیاهان من</h2>
        <button id="btn-add-plant" class="btn btn-primary">
          + افزودن گیاه
        </button>
      </div>

      <div id="plants-list" class="plants-list">
        <!-- گیاهان با JavaScript اینجا اضافه می‌شوند -->
      </div>

      <div id="empty-state" class="empty-state" style="display: none;">
        <p>هنوز گیاهی ثبت نکرده‌اید.</p>
        <p>برای شروع، روی «افزودن گیاه» کلیک کنید.</p>
      </div>
    </section>

    <!-- ============================================
         صفحه افزودن گیاه (Add)
         ============================================ -->
    <section id="page-add" class="page">
      <div class="page-header">
        <button id="btn-back-from-add" class="btn btn-back">← بازگشت</button>
        <h2 class="page-title">افزودن گیاه جدید</h2>
      </div>

      <form id="form-add-plant" class="plant-form">
        <div class="form-group">
          <label for="add-name" class="form-label">نام گیاه *</label>
          <input type="text" id="add-name" class="form-input" required>
        </div>

        <div class="form-group">
          <label for="add-type" class="form-label">نوع گیاه</label>
          <input type="text" id="add-type" class="form-input">
        </div>

        <div class="form-group">
          <label for="add-location" class="form-label">محل نگهداری</label>
          <input type="text" id="add-location" class="form-input">
        </div>

        <div class="form-group">
          <label for="add-image" class="form-label">تصویر گیاه (اختیاری)</label>
          <input type="file" id="add-image" class="form-input" accept="image/*">
        </div>

        <div class="form-group">
          <label for="add-notes" class="form-label">یادداشت (اختیاری)</label>
          <textarea id="add-notes" class="form-textarea" rows="4"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">ذخیره</button>
          <button type="button" id="btn-cancel-add" class="btn btn-secondary">انصراف</button>
        </div>
      </form>
    </section>

    <!-- ============================================
         صفحه جزئیات گیاه (Details)
         ============================================ -->
    <section id="page-details" class="page">
      <div class="page-header">
        <button id="btn-back-from-details" class="btn btn-back">← بازگشت</button>
        <h2 class="page-title">جزئیات گیاه</h2>
      </div>

      <div class="plant-details">
        <div class="plant-details-image">
          <img id="details-image" src="assets/images/default-plant.png" alt="تصویر گیاه">
        </div>

        <div class="plant-details-info">
          <div class="plant-info-row">
            <span class="plant-info-label">نام گیاه:</span>
            <span id="details-name" class="plant-info-value">—</span>
          </div>
          <div class="plant-info-row">
            <span class="plant-info-label">نوع گیاه:</span>
            <span id="details-type" class="plant-info-value">—</span>
          </div>
          <div class="plant-info-row">
            <span class="plant-info-label">محل نگهداری:</span>
            <span id="details-location" class="plant-info-value">—</span>
          </div>
          <div class="plant-info-row">
            <span class="plant-info-label">یادداشت:</span>
            <span id="details-notes" class="plant-info-value">—</span>
          </div>
        </div>
      </div>

      <div class="plant-details-actions">
        <button id="btn-edit-plant" class="btn btn-secondary">ویرایش</button>
        <button id="btn-delete-plant" class="btn btn-danger">حذف</button>
      </div>

      <div class="care-history">
        <h3 class="care-history-title">تاریخچه آبیاری</h3>
        <button id="btn-add-care" class="btn btn-primary">+ ثبت آبیاری جدید</button>
        <div id="care-logs-list" class="care-logs-list">
          <!-- تاریخچه با JavaScript اینجا اضافه می‌شود -->
        </div>
        <div id="empty-care-logs" class="empty-state" style="display: none;">
          <p>هنوز آبیاری ثبت نشده است.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ============================================
       فوتر مشترک
       ============================================ -->
  <footer class="app-footer">
    <p>نسخه ۰.۱.۰ — در حال ساخت</p>
  </footer>

  <!-- ============================================
       فایل‌های JavaScript
       ============================================ -->
  <script src="js/database.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
